<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="posBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="posAccent" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#posBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Main POS Cart & Checkout Icon -->
  <g filter="url(#shadow)">
    <!-- Cart Basket Track -->
    <path d="M14 18h7l4.5 19.5c.3 1.4 1.5 2.5 3 2.5h17.5c1.4 0 2.6-1 2.9-2.4L51 24H20.5" 
          stroke="#ffffff" 
          stroke-width="3.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Wheels -->
    <circle cx="30" cy="48" r="3.2" fill="#ffffff" />
    <circle cx="45" cy="48" r="3.2" fill="#ffffff" />

    <!-- Smart Checkout Spark / POS Symbol -->
    <path d="M37 11.5l-4.5 8h6l-4 8 8.5-10.5h-6l4.5-5.5z" fill="url(#posAccent)" />
  </g>
</svg>